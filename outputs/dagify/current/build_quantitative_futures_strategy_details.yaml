dag_type: plain_text
description: Constructs a quantitative trading strategy for futures markets through
  data collection, analysis, model development, backtesting, and optimization.
name: build_quantitative_futures_strategy
nodes:
  analyze_market_structure:
    agent: false
    description: Characterize market depth and liquidity patterns
    name: analyze_market_structure
    nodes_depended_on:
    - process_historical_data
    - calculate_statistical_metrics
    nodes_dependent_on:
    - build_signal_generation_model
    - model_regression_based_strategy
    prompt: Analyze order book dynamics and liquidity regimes by calculating participation
      rates, slippage estimates, and latency sensitivity. Identify day/time-of-week
      patterns in market depth.
  backtest_trading_signals:
    agent: false
    description: Validate strategy performance on historical data
    name: backtest_trading_signals
    nodes_depended_on:
    - build_signal_generation_model
    - model_regression_based_strategy
    - create_liquidity_control_rules
    nodes_dependent_on:
    - optimize_model_parameters
    - calculate_performance_metrics
    prompt: 'Backtest trading signals using walk-forward analysis with 12mo rolling
      windows. Report: equity curve, sharpe ratio, max DD, annualized return, drawdown
      duration profile.'
  build_signal_generation_model:
    agent: false
    description: Develop core trading signal generation mechanism
    name: build_signal_generation_model
    nodes_depended_on:
    - feature_engineering
    - define_strategy_framework
    - analyze_market_structure
    nodes_dependent_on:
    - backtest_trading_signals
    prompt: Implement a signal generation model using selected features and strategy
      framework. Create explicit weighting/floating thresholds for entry/exit decisions.
      Format as pseudocode with parameter definitions.
  calculate_performance_metrics:
    agent: false
    description: Quantify strategy efficiency across multiple dimensions
    name: calculate_performance_metrics
    nodes_depended_on:
    - backtest_trading_signals
    - optimize_model_parameters
    nodes_dependent_on:
    - compile_strategy_documentation
    prompt: 'Calculate: annualized return, sharpe ratio, sortino ratio, calmar ratio,
      win rate, average holding period, and drawdown recovery speed for both baseline
      and optimized models.'
  calculate_statistical_metrics:
    agent: false
    description: Compute key statistical properties of returns distribution
    name: calculate_statistical_metrics
    nodes_depended_on:
    - process_historical_data
    nodes_dependent_on:
    - analyze_market_structure
    - model_regression_based_strategy
    prompt: Calculate daily/weekly/monthly return distributions, volatility clustering
      metrics, and non-normality measures (skew, kurtosis) for each futures contract
      series. Present as time-weighted summary statistics.
  collect_historical_future_data:
    agent: false
    description: Retrieve historical futures price data for targeted contracts
    name: collect_historical_future_data
    nodes_depended_on: []
    nodes_dependent_on:
    - process_historical_data
    - feature_engineering
    prompt: Identify and collect 5+ years of historical futures data including open/high/low/close
      prices, volumes, and open interest for multiple contract months. Format as CSV
      with timestamped rows.
  compile_strategy_documentation:
    agent: false
    description: Produce complete strategy specification document
    name: compile_strategy_documentation
    nodes_depended_on:
    - calculate_performance_metrics
    - define_strategy_framework
    nodes_dependent_on: []
    prompt: 'Document the quantitative strategy with: 1) Investment thesis (200 words),
      2) Signal generation methodology (flowchart), 3) Risk controls (rules table),
      4) Parameter ranges, 5) Performance summary (table), 6) System requirements.'
  create_liquidity_control_rules:
    agent: false
    description: Develop adaptive liquidity management protocols
    name: create_liquidity_control_rules
    nodes_depended_on:
    - define_strategy_framework
    - analyze_market_structure
    nodes_dependent_on:
    - design_position_sizing_rules
    - backtest_trading_signals
    prompt: Formulate rules that adjust trade size based on depth-of-book, volatility,
      and time-of-day regimes. Include explicit threshold values for switching between
      market/limit orders and batch execution.
  define_strategy_framework:
    agent: false
    description: Establish quantitative strategy architecture
    name: define_strategy_framework
    nodes_depended_on: []
    nodes_dependent_on:
    - build_signal_generation_model
    - create_liquidity_control_rules
    prompt: Formulate a quantitative framework specifying strategy type (stat arb,
      trend following, etc.), signal generation methodology, position sizing, and
      execution protocols. Limit description to 250 words with 3-5 defining characteristics.
  design_position_sizing_rules:
    agent: false
    description: Create dynamic capital allocation methodology
    name: design_position_sizing_rules
    nodes_depended_on:
    - calculate_statistical_metrics
    - create_liquidity_control_rules
    nodes_dependent_on:
    - backtest_trading_signals
    - build_signal_generation_model
    prompt: Design position sizing algorithm that adjusts risk exposure based on realized
      volatility, liquidity conditions, and confidence level in signals. Include VaR
      constraints and margin requirements.
  feature_engineering:
    agent: false
    description: Create predictive features from raw data
    name: feature_engineering
    nodes_depended_on:
    - process_historical_data
    - identify_risk_factors
    nodes_dependent_on:
    - build_signal_generation_model
    - model_regression_based_strategy
    prompt: 'Generate 20-30 predictive features including: technical indicators (RSI,
      MACD), volatility surfaces, momentum factors, liquidity ratios, and macroeconomic
      spreads. Apply feature ranking techniques to identify strongest candidates.'
  identify_risk_factors:
    agent: false
    description: Determine macroeconomic and market risk factors affecting futures
    name: identify_risk_factors
    nodes_depended_on: []
    nodes_dependent_on:
    - feature_engineering
    prompt: List 8-12 relevant risk factors for futures trading (e.g., interest rates,
      commodity prices, macroeconomic indicators). Categorize each as either price
      drivers, volatility factors, or liquidity risks.
  model_regression_based_strategy:
    agent: false
    description: Construct statistical arbitrage models for predictive signals
    name: model_regression_based_strategy
    nodes_depended_on:
    - calculate_statistical_metrics
    - feature_engineering
    - analyze_market_structure
    nodes_dependent_on:
    - backtest_trading_signals
    prompt: Develop 3-5 regression-based models using feature set to predict price
      movements. Apply regularization techniques and select best-performing model
      based on out-of-sample validation. Document coefficient significance.
  optimize_model_parameters:
    agent: false
    description: Refine model hyperparameters using robust methods
    name: optimize_model_parameters
    nodes_depended_on:
    - backtest_trading_signals
    nodes_dependent_on:
    - validate_overfitting_risk
    - calculate_performance_metrics
    prompt: Optimize signal generation and position sizing parameters using cross-validation.
      Document optimal parameter ranges that pass out-of-sample tests. Focus on walk-forward
      performance consistency.
  process_historical_data:
    agent: false
    description: Clean and normalize raw futures data for analysis
    name: process_historical_data
    nodes_depended_on:
    - collect_historical_future_data
    nodes_dependent_on:
    - calculate_statistical_metrics
    - feature_engineering
    prompt: 'Clean raw futures data by: 1) Handling missing timestamps, 2) Adjusting
      for contract rollover, 3) Calculating continuous price series, 4) Normalizing
      volumes. Output cleaned dataset with consistent time intervals.'
  validate_overfitting_risk:
    agent: false
    description: Assess model robustness to different market regimes
    name: validate_overfitting_risk
    nodes_depended_on:
    - optimize_model_parameters
    nodes_dependent_on:
    - calculate_performance_metrics
    prompt: Stress-test optimized parameters using 5+ different market regimes (bull,
      bear, high-volatility, etc.). Identify parameter ranges that produced meaningful
      backtesting degradation.
