dag_type: spec
description: Generated workflow from UI.
name: build_quantitative_futures_strategy
nodes:
  analyze_market_structure:
    agent: false
    description: Characterize market depth and liquidity patterns
    name: analyze_market_structure
    nodes_depended_on:
    - process_historical_data
    - calculate_statistical_metrics
    nodes_dependent_on: []
    output_structure:
    - description: Calculated participation rates for each time interval (as percentages
        expressed in decimal form).
      key: participation_rates
      type: List[float]
    - description: Estimated slippage values (price impact) for representative trade
        sizes, expressed in price units.
      key: slippage_estimates
      type: List[float]
    - description: Measured sensitivity of execution cost to latency, expressed as
        cost increase per millisecond.
      key: latency_sensitivity
      type: List[float]
    - description: Descriptive identifiers of recurring market depth patterns observed
        for each day of the week (e.g., "Monday high liquidity", "Friday low depth").
      key: day_of_week_patterns
      type: List[str]
    - description: Descriptive identifiers of recurring market depth patterns observed
        for major time-of-day windows.
      key: time_of_day_patterns
      type: List[str]
    - description: Narrative summary of the market structure analysis, highlighting
        key regimes and actionable insights.
      key: summary_report
      type: str
    prd:
      conceptual_info: This node consumes cleaned order‑book and price series (produced
        by `process_historical_data`) together with high‑level statistical descriptors
        of returns (produced by `calculate_statistical_metrics`). It quantifies how
        market depth and liquidity evolve across time, derives participation‑rate,
        slippage and latency‑sensitivity profiles, discovers recurring day‑of‑week
        and intraday patterns, and finally synthesizes a concise narrative that can
        be consumed by downstream signal‑generation and liquidity‑control modules.
      docstring:
        examples:
        - lines:
          - cleaned_csv = "timestamp,open,high,low,close,volume,open_interest\n2023-01-01
            09:30,100,101,99,100.5,5000,2000"
          - 'stats = {"contract_series": ["CL_F2023"], "daily_return_std": [0.015]}'
          - result = analyze_market_structure(cleaned_csv, stats)
          - result['summary_report']
          output: '"The market exhibits high participation during morning sessions
            with low slippage, but latency sensitivity rises sharply after 14:00 UTC.
            Monday shows consistently high depth, while the 09:30‑11:30 window is
            the most liquid."'
        - lines:
          - cleaned_csv = "timestamp,open,high,low,close,volume,open_interest\n2023-01-02
            10:00,200,202,198,201,8000,3000"
          - 'stats = {"contract_series": ["GC_F2023"], "daily_return_std": [0.02]}'
          - result = analyze_market_structure(cleaned_csv, stats)
          - result['participation_rates']
          output: '[0.12, 0.15, 0.09, 0.11]'
        parameters:
        - description: CSV string from `process_historical_data` containing timestamped
            OHLCV and open‑interest data.
          name: cleaned_data_csv
          type: str
        - description: Dictionary from `calculate_statistical_metrics` containing
            return moments and volatility‑clustering metrics for each contract series.
          name: statistical_metrics
          type: dict
        raises:
        - description: If `cleaned_data_csv` is empty or malformed.
          type: ValueError
        - description: If required fields are missing from `statistical_metrics`.
          type: KeyError
        returns:
          description: 'Dictionary with keys matching the node''s output_structure:
            participation_rates, slippage_estimates, latency_sensitivity, day_of_week_patterns,
            time_of_day_patterns, and summary_report.'
          type: dict
        summary: Analyze market depth and liquidity regimes to produce participation,
          slippage, latency, and pattern insights.
    prompt: Analyze order book dynamics and liquidity regimes by calculating participation
      rates, slippage estimates, and latency sensitivity. Identify day/time-of-week
      patterns in market depth.
  backtest_trading_signals:
    agent: false
    description: Validate strategy performance on historical data using walk‑forward
      analysis with 12‑month rolling windows and report key performance metrics.
    name: backtest_trading_signals
    nodes_depended_on:
    - build_signal_generation_model
    - model_regression_based_strategy
    - create_liquidity_control_rules
    nodes_dependent_on: []
    output_structure:
    - description: Time‑series of portfolio equity values for each backtest period
      key: equity_curve
      type: List[float]
    - description: Annualized Sharpe ratio of the backtested strategy
      key: sharpe_ratio
      type: float
    - description: Maximum percentage drawdown observed across all walk‑forward windows
      key: max_drawdown
      type: float
    - description: Overall annualized return percentage from the backtest
      key: annualized_return
      type: float
    - description: List of drawdown durations (in days) for each observed drawdown
        event
      key: drawdown_duration_profile
      type: List[int]
    prd:
      conceptual_info: Executes a walk‑forward backtest of the generated trading signals,
        applying the signal model, regression‑based forecasts, and liquidity control
        rules across successive 12‑month windows. It aggregates portfolio equity over
        time and computes standard risk‑adjusted performance statistics.
      docstring:
        examples:
        - lines:
          - results = backtest_trading_signals()
          output: "{\n  'equity_curve': [100000.0, 101200.5, 102450.3, ...],\n  'sharpe_ratio':\
            \ 1.45,\n  'max_drawdown': -0.12,\n  'annualized_return': 0.18,\n  'drawdown_duration_profile':\
            \ [5, 12, 7]\n}"
        - lines:
          - 'print(f"Annualized Return: {results[''annualized_return'']:.2%}")'
          output: 'Annualized Return: 18.00%'
        parameters: []
        raises:
        - description: If any of the dependent nodes fail to produce required inputs
            (e.g., missing model pseudocode or liquidity rules).
          type: ValueError
        - description: If the backtest simulation encounters an unexpected error such
            as data misalignment or division by zero.
          type: RuntimeError
        returns:
          description: Dictionary containing `equity_curve`, `sharpe_ratio`, `max_drawdown`,
            `annualized_return`, and `drawdown_duration_profile` as defined in the
            output structure.
          type: dict
        summary: Run a 12‑month rolling walk‑forward backtest of the strategy and
          return key performance metrics.
    prompt: 'Backtest trading signals using walk-forward analysis with 12mo rolling
      windows. Report: equity curve, sharpe ratio, max DD, annualized return, drawdown
      duration profile.'
  build_signal_generation_model:
    agent: false
    description: Develop core trading signal generation mechanism by integrating selected
      predictive features, strategy framework specifications, and market structure
      insights into a weighted scoring model with explicit entry/exit thresholds and
      position sizing parameters.
    name: build_signal_generation_model
    nodes_depended_on:
    - feature_engineering
    - define_strategy_framework
    - analyze_market_structure
    nodes_dependent_on: []
    output_structure:
    - description: Pseudocode representation of the signal generation model, including
        logic flow and conditional statements.
      key: model_pseudocode
      type: str
    - description: List of feature names used as inputs to the signal generation model.
      key: feature_names
      type: List[str]
    - description: Corresponding weight for each feature in the model, reflecting
        its importance.
      key: feature_weights
      type: List[float]
    - description: Threshold values that trigger entry signals for each defined signal
        component.
      key: entry_thresholds
      type: List[float]
    - description: Threshold values that trigger exit signals for each defined signal
        component.
      key: exit_thresholds
      type: List[float]
    - description: Parameters related to position sizing (e.g., volatility scaling
        factor, max exposure) used within the model.
      key: position_sizing_parameters
      type: List[float]
    prd:
      conceptual_info: This node synthesizes the selected predictive features, the
        high‑level strategy framework, and market‑structure characteristics into a
        deterministic signal generation model. The model assigns weights to each feature,
        computes a composite score, and compares it against configurable entry and
        exit thresholds. The resulting pseudocode, together with the explicit parameter
        lists, serves as the core logic for downstream backtesting and execution modules.
      docstring:
        examples:
        - lines:
          - model = build_signal_generation_model()
          - print(model["feature_names"])
          - print(model["entry_thresholds"])
          output: '["rsi_14", "macd_hist", "vol_surface_30d"]\n[0.6, -0.3]'
        - lines:
          - model = build_signal_generation_model()
          - print(model["model_pseudocode"])
          output: \"\"\"# Pseudocode\\nscore = 0.0\\nfor f, w in zip(feature_names,
            feature_weights):\\n    score += w * get_feature(f)\\nif score > entry_thresholds[0]:\\n    signal
            = 'LONG'\\nelif score < exit_thresholds[0]:\\n    signal = 'SHORT'\\nelse:\\n    signal
            = 'HOLD'\\n# Position sizing\\nsize = base_notional * position_sizing_parameters[0]\\n\"\"\""
        parameters: []
        raises:
        - description: If the parent nodes do not provide matching lengths for feature_names
            and feature_weights.
          type: ValueError
        - description: If required inputs from any parent node are missing or malformed.
          type: RuntimeError
        returns:
          description: "A dictionary containing the model pseudocode and all parameter\
            \ arrays:\n{\n    \"model_pseudocode\": str,\n    \"feature_names\": List[str],\n\
            \    \"feature_weights\": List[float],\n    \"entry_thresholds\": List[float],\n\
            \    \"exit_thresholds\": List[float],\n    \"position_sizing_parameters\"\
            : List[float]\n}"
          type: dict
        summary: Constructs a weighted signal generation model using feature engineering
          output, strategy framework definitions, and market structure analysis.
    prompt: Implement a signal generation model using selected features and strategy
      framework. Create explicit weighting/floating thresholds for entry/exit decisions.
      Format as pseudocode with parameter definitions.
  calculate_performance_metrics:
    agent: false
    description: Quantify strategy efficiency across multiple dimensions
    name: calculate_performance_metrics
    nodes_depended_on:
    - backtest_trading_signals
    - optimize_model_parameters
    nodes_dependent_on: []
    output_structure:
    - description: Annualized return of the baseline model (percentage expressed as
        decimal)
      key: baseline_annualized_return
      type: float
    - description: Annualized return of the optimized model (percentage expressed
        as decimal)
      key: optimized_annualized_return
      type: float
    - description: Sharpe ratio of the baseline model
      key: baseline_sharpe_ratio
      type: float
    - description: Sharpe ratio of the optimized model
      key: optimized_sharpe_ratio
      type: float
    - description: Sortino ratio of the baseline model
      key: baseline_sortino_ratio
      type: float
    - description: Sortino ratio of the optimized model
      key: optimized_sortino_ratio
      type: float
    - description: Calmar ratio of the baseline model
      key: baseline_calmar_ratio
      type: float
    - description: Calmar ratio of the optimized model
      key: optimized_calmar_ratio
      type: float
    - description: Proportion of winning trades for the baseline model (0 to 1)
      key: baseline_win_rate
      type: float
    - description: Proportion of winning trades for the optimized model (0 to 1)
      key: optimized_win_rate
      type: float
    - description: Average holding period of trades in the baseline model (in days)
      key: baseline_avg_holding_period
      type: float
    - description: Average holding period of trades in the optimized model (in days)
      key: optimized_avg_holding_period
      type: float
    - description: Speed of drawdown recovery for the baseline model (e.g., days to
        recover 50% of max drawdown)
      key: baseline_drawdown_recovery_speed
      type: float
    - description: Speed of drawdown recovery for the optimized model (e.g., days
        to recover 50% of max drawdown)
      key: optimized_drawdown_recovery_speed
      type: float
    prd:
      conceptual_info: This node ingests the backtested equity curve and trade‑level
        details for the baseline strategy as well as the optimized parameter set,
        computes a comprehensive suite of performance metrics for each, and returns
        a paired comparison. The metrics span return, risk‑adjusted ratios, trade
        success, holding characteristics, and drawdown recovery, enabling downstream
        documentation and decision‑making.
      docstring:
        examples:
        - lines:
          - baseline = {
          - '    ''equity_curve'': [100, 102, 105, 103],'
          - '    ''sharpe_ratio'': 1.2,'
          - '    ''max_drawdown'': -0.04,'
          - '    ''annualized_return'': 0.15,'
          - '    ''drawdown_duration_profile'': [2, 3]'
          - '}'
          - 'optimized_params = {''optimal_signal_parameters'': [''threshold=0.6''],
            ''optimal_position_sizing_parameters'': [''vol_factor=1.1'']}'
          - metrics = calculate_performance_metrics(baseline, optimized_params)
          output: "{\n  'baseline_annualized_return': 0.15,\n  'optimized_annualized_return':\
            \ 0.18,\n  'baseline_sharpe_ratio': 1.2,\n  'optimized_sharpe_ratio':\
            \ 1.35,\n  'baseline_sortino_ratio': 1.5,\n  'optimized_sortino_ratio':\
            \ 1.7,\n  'baseline_calmar_ratio': 3.75,\n  'optimized_calmar_ratio':\
            \ 4.2,\n  'baseline_win_rate': 0.55,\n  'optimized_win_rate': 0.62,\n\
            \  'baseline_avg_holding_period': 4.2,\n  'optimized_avg_holding_period':\
            \ 3.9,\n  'baseline_drawdown_recovery_speed': 5.0,\n  'optimized_drawdown_recovery_speed':\
            \ 4.2\n}"
        parameters:
        - description: 'Dictionary output from `backtest_trading_signals` for the
            baseline model containing keys: ''equity_curve'' (list[float]), ''sharpe_ratio''
            (float), ''max_drawdown'' (float), ''annualized_return'' (float), ''drawdown_duration_profile''
            (list[int]).'
          name: baseline_backtest
          type: dict
        - description: Dictionary output from `optimize_model_parameters` containing
            the optimized parameter settings. Used to re‑run backtest internally for
            the optimized model.
          name: optimized_params
          type: dict
        raises:
        - description: If required keys are missing from inputs or if the equity curve
            lengths are inconsistent.
          type: ValueError
        - description: If the optimized backtest fails to produce a valid equity curve.
          type: RuntimeError
        returns:
          description: Dictionary with the keys defined in the node's output_structure,
            each mapping to a float metric for baseline and optimized models.
          type: dict
        summary: Compute detailed performance metrics for baseline and optimized trading
          models.
    prompt: 'Calculate: annualized return, sharpe ratio, sortino ratio, calmar ratio,
      win rate, average holding period, and drawdown recovery speed for both baseline
      and optimized models.'
  calculate_statistical_metrics:
    agent: false
    description: Compute key statistical properties of returns distribution for each
      futures contract series, including daily/weekly/monthly return moments, volatility
      clustering, and non‑normality measures, and produce a time‑weighted human‑readable
      summary.
    name: calculate_statistical_metrics
    nodes_depended_on:
    - process_historical_data
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers of futures contract series for which metrics are calculated
      key: contract_series
      type: List[str]
    - description: Mean daily return for each contract series
      key: daily_return_mean
      type: List[float]
    - description: Standard deviation of daily returns for each contract series
      key: daily_return_std
      type: List[float]
    - description: Mean weekly return for each contract series
      key: weekly_return_mean
      type: List[float]
    - description: Standard deviation of weekly returns for each contract series
      key: weekly_return_std
      type: List[float]
    - description: Mean monthly return for each contract series
      key: monthly_return_mean
      type: List[float]
    - description: Standard deviation of monthly returns for each contract series
      key: monthly_return_std
      type: List[float]
    - description: Metric quantifying volatility clustering for each contract series
      key: volatility_clustering_metric
      type: List[float]
    - description: Skewness of return distribution for each contract series
      key: skewness
      type: List[float]
    - description: Kurtosis of return distribution for each contract series
      key: kurtosis
      type: List[float]
    - description: Human‑readable summary of the statistical metrics, weighted by
        observation time
      key: time_weighted_summary
      type: str
    prd:
      conceptual_info: This node transforms cleaned historical futures price data
        into a comprehensive statistical portrait of each contract series. By aggregating
        returns at daily, weekly, and monthly horizons and evaluating higher‑order
        moments and volatility clustering, it supplies downstream components (market‑structure
        analysis, position sizing, and regression models) with robust descriptors
        of return behavior that are essential for risk assessment and signal generation.
      docstring:
        examples:
        - lines:
          - csv_data = ("timestamp,open,high,low,close,volume,open_interest\n"
          - '            "2023-01-01 09:30,100,101,99,100.5,2000,10\n"'
          - '            "2023-01-02 09:30,100.5,102,100,101,2100,11")'
          - metrics = calculate_statistical_metrics(csv_data)
          output: "{\n  'contract_series': ['CL_FUT'],\n  'daily_return_mean': [0.005],\n\
            \  'daily_return_std': [0.0012],\n  'weekly_return_mean': [0.032],\n \
            \ 'weekly_return_std': [0.005],\n  'monthly_return_mean': [0.128],\n \
            \ 'monthly_return_std': [0.020],\n  'volatility_clustering_metric': [1.45],\n\
            \  'skewness': [0.12],\n  'kurtosis': [3.4],\n  'time_weighted_summary':\
            \ 'Daily mean 0.5 %, weekly mean 3.2 %, monthly mean 12.8 %, volatility\
            \ clustering 1.45, skew 0.12, kurtosis 3.4.'\n}"
        - lines:
          - '# Missing required column triggers an error'
          - bad_csv = "timestamp,open,high,low,volume,open_interest\n2023-01-01 09:30,100,101,99,2000,10"
          - calculate_statistical_metrics(bad_csv)
          output: 'ValueError: CSV must contain a ''close'' column.'
        parameters:
        - description: 'CSV‑formatted string produced by `process_historical_data`,
            containing columns: timestamp, open, high, low, close, volume, open_interest.'
          name: cleaned_data_csv
          type: str
        raises:
        - description: If the CSV cannot be parsed, lacks required columns, or contains
            insufficient data for a given contract series.
          type: ValueError
        - description: If numerical computations (e.g., division by zero in volatility
            clustering) fail.
          type: RuntimeError
        returns:
          description: Dictionary with keys matching the node's output_structure,
            each holding the computed metric list or summary string.
          type: dict
        summary: Calculate statistical return metrics for multiple futures contract
          series from cleaned price data.
    prompt: Calculate daily/weekly/monthly return distributions, volatility clustering
      metrics, and non‑normality measures (skew, kurtosis) for each futures contract
      series. Present as time‑weighted summary statistics.
  collect_historical_future_data:
    agent: false
    description: Retrieve historical futures price data for targeted contracts
    name: collect_historical_future_data
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: 'List of CSV-formatted rows, each row representing a timestamped
        record with fields: timestamp, contract_month, open, high, low, close, volume,
        open_interest'
      key: csv_rows
      type: List[str]
    - description: List of contract identifiers (e.g., futures symbols and months)
        included in the collected dataset
      key: contracts
      type: List[str]
    - description: Earliest date (inclusive) of the collected data in ISO 8601 format
        (YYYY-MM-DD)
      key: start_date
      type: str
    - description: Latest date (inclusive) of the collected data in ISO 8601 format
        (YYYY-MM-DD)
      key: end_date
      type: str
    - description: Total number of data rows collected (excluding header)
      key: row_count
      type: int
    prd:
      conceptual_info: This node gathers extensive historical price and volume information
        for a set of futures contracts spanning at least five years. The raw data
        is organized into CSV rows, each timestamped and annotated with contract month,
        enabling downstream cleaning, analysis, and strategy development.
      docstring:
        examples:
        - lines:
          - result = collect_historical_future_data()
          output: "{\n    'csv_rows': [\n        '2020-01-02 09:30:00,CLM2020,71.45,71.60,71.30,71.55,12000,50000',\n\
            \        '2020-01-02 09:31:00,CLM2020,71.55,71.70,71.40,71.65,11500,50500',\n\
            \        ...\n    ],\n    'contracts': ['CLM2020', 'CLU2020', 'CLZ2021'],\n\
            \    'start_date': '2015-01-02',\n    'end_date': '2023-12-31',\n    'row_count':\
            \ 1056000\n}"
        - lines:
          - len(result['csv_rows'])
          - result['row_count']
          output: '1056000

            1056000'
        parameters: []
        raises:
        - description: If the data provider service cannot be reached.
          type: ConnectionError
        - description: If no contracts satisfy the 5‑year data requirement.
          type: ValueError
        - description: If the retrieved data cannot be parsed into the expected CSV
            schema.
          type: RuntimeError
        returns:
          description: 'Dictionary containing:

            - **csv_rows** (List[str]): CSV rows with fields timestamp, contract_month,
            open, high, low, close, volume, open_interest.

            - **contracts** (List[str]): Identifiers of the contracts included.

            - **start_date** (str): ISO‑8601 start date of the dataset.

            - **end_date** (str): ISO‑8601 end date of the dataset.

            - **row_count** (int): Number of data rows (excluding header).'
          type: dict
        summary: Collects multi‑year historical futures price, volume, and open‑interest
          data and returns it in a structured CSV format.
    prompt: Identify and collect 5+ years of historical futures data including open/high/low/close
      prices, volumes, and open interest for multiple contract months. Format as CSV
      with timestamped rows.
  compile_strategy_documentation:
    agent: false
    description: Produce a comprehensive strategy specification document by synthesizing
      the framework definition and performance metrics into human‑readable sections.
    name: compile_strategy_documentation
    nodes_depended_on:
    - calculate_performance_metrics
    - define_strategy_framework
    nodes_dependent_on: []
    output_structure:
    - description: A concise 200‑word description of the investment thesis behind
        the strategy
      key: investment_thesis
      type: str
    - description: Markdown or textual representation of the flowchart describing
        the signal generation methodology
      key: signal_generation_flowchart
      type: str
    - description: Formatted table (as markdown text) listing risk control rules and
        their definitions
      key: risk_controls_table
      type: str
    - description: Description of key model and execution parameters with recommended
        ranges
      key: parameter_ranges
      type: str
    - description: Markdown table summarizing performance metrics (e.g., annualized
        return, Sharpe, drawdown) for baseline and optimized models
      key: performance_summary_table
      type: str
    - description: List of hardware, software, and operational requirements needed
        to run the strategy
      key: system_requirements
      type: str
    prd:
      conceptual_info: This node consolidates the quantitative strategy framework
        and the quantitative performance analysis into a single, structured documentation
        artifact that can be shared with stakeholders, compliance, and development
        teams.
      docstring:
        examples:
        - lines:
          - doc = compile_strategy_documentation()
          - print(doc['investment_thesis'])
          - print(doc['performance_summary_table'])
          output: A concise 200‑word investment thesis describing the market inefficiency
            the strategy exploits...\n| Metric                | Baseline | Optimized
            |\n|----------------------|----------|-----------|\n| Annualized Return    |
            0.12     | 0.18      |\n| Sharpe Ratio         | 1.4      | 2.1       |\n|
            Max Drawdown         | -0.08    | -0.05     |
        - lines:
          - doc = compile_strategy_documentation()
          - assert isinstance(doc['signal_generation_flowchart'], str)
          - assert doc['system_requirements'].startswith('Hardware')
          output: 'True'
        parameters: []
        raises:
        - description: If required fields from parent nodes are missing.
          type: KeyError
        - description: If any generated section exceeds its length or formatting constraints.
          type: ValueError
        returns:
          description: A dictionary containing the six documentation sections defined
            in the output_structure.
          type: dict
        summary: Generate a full strategy documentation package from framework and
          performance data.
    prompt: 'Document the quantitative strategy with: 1) Investment thesis (200 words),
      2) Signal generation methodology (flowchart), 3) Risk controls (rules table),
      4) Parameter ranges, 5) Performance summary (table), 6) System requirements.'
  create_liquidity_control_rules:
    agent: false
    description: Develop adaptive liquidity management protocols that adjust trade
      size, order type, and batch execution based on order‑book depth, market volatility,
      and time‑of‑day regimes.
    name: create_liquidity_control_rules
    nodes_depended_on:
    - define_strategy_framework
    - analyze_market_structure
    nodes_dependent_on: []
    output_structure:
    - description: Identifiers for each liquidity control rule
      key: rule_names
      type: List[str]
    - description: Depth‑of‑book thresholds (e.g., minimum available volume) for each
        rule
      key: depth_thresholds
      type: List[float]
    - description: Volatility levels (e.g., standard deviation of recent price changes)
        that trigger the rule
      key: volatility_thresholds
      type: List[float]
    - description: Time‑of‑day regimes (e.g., "09:30-11:00", "15:00-16:00") applicable
        to each rule
      key: time_of_day_windows
      type: List[str]
    - description: Order execution type for each rule (e.g., "market", "limit")
      key: order_type
      type: List[str]
    - description: Whether batch execution is enabled for each rule
      key: batch_execution_flags
      type: List[bool]
    - description: Human‑readable description of each liquidity control rule
      key: rule_descriptions
      type: List[str]
    prd:
      conceptual_info: This node translates the high‑level strategy framework and
        market‑structure analysis into concrete liquidity‑control rules. Each rule
        specifies when to use market vs. limit orders, whether to batch trades, and
        the depth/volatility thresholds that trigger the rule, enabling the execution
        engine to adapt to changing market conditions.
      docstring:
        examples:
        - lines:
          - rules = create_liquidity_control_rules()
          - rules['rule_names']
          - rules['order_type']
          output: '["high_liquidity_market", "low_volatility_limit"]\n["market", "limit"]'
        - lines:
