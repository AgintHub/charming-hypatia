          - '}'
          - liq_rules = {
          - '    ''depth_thresholds'': [1000, 2000],'
          - '    ''volatility_thresholds'': [0.02, 0.03]'
          - '}'
          - result = design_position_sizing_rules(stat_metrics, liq_rules)
          output: "{\n  'position_sizing_algorithm': 'Volatility‑adjusted, liquidity‑aware\
            \ sizing with confidence and risk caps.',\n  'sizing_rules': [\n    'base_size\
